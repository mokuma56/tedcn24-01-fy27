---
dev_addr: "0.0.0.0:8000"
site_name: "Cisco Cloud Control Value Realization"
site_description: "Cisco Cloud Control Value Realization"
site_author: "Cisco"
copyright: Copyright &copy; 2024 Cisco
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - navigation.expand
    - search.suggest
    - content.code.copy
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: template_assets/cisco_logo.png
  favicon: template_assets/cisco_logo.png
extra:
  generator: false
  event: "AMER Stay Ready Friday"
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/links.js
plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      auto_caption: true
      caption_position: top
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - tables
  - toc:
      toc_depth: 2
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Introduction: introduction/index.md
  - "Section 1: Explore the LAB and Cloud Control Capabilities": section-1-explore-the-lab-and-cloud-control-capabilities/index.md
  - "Section 2: Experience the Agentic AI Canvas": section-2-experience-the-agentic-ai-canvas/index.md
  - "Section 3: Identity": section-3-identity/index.md
  - "Section 4: Splunk Secure Networking App": section-4-splunk-secure-networking-app/index.md
  - "Section 5: Studio": section-5-studio/index.md
  - "Section 6: Cloud Control and Cisco IQ": section-6-cloud-control-and-cisco-iq/index.md
  - "Appendix A: AI Canvas Prompt Library": appendix-a-ai-canvas-prompt-library/index.md
  - "Appendix B: Scenarios": appendix-b-scenarios/index.md
  - "Appendix C: Investigation Guide": appendix-c-investigation-guide/index.md
  - Conclusion: conclusion/index.md

